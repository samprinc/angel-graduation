<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Angel</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* The Royal Color Palette */
        :root {
            --black: #050505; /* Slightly darker for more contrast */
            --wine-red: #722F37;
            --pink: #FFC0CB;
            --dark-wine: #3A1020;
            --gold: #D4AF37; /* Added a touch of gold for the text emphasis */
        }

        body {
            background-color: var(--black);
            color: var(--pink);
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Changed to allow scrolling for the note */
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at top center, var(--dark-wine) 0%, var(--black) 80%);
            padding-top: 8vh;
            padding-bottom: 10vh;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--wine-red);
            text-shadow: 2px 2px 15px rgba(255, 192, 203, 0.4);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 1.3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--pink);
            opacity: 0.9;
            font-weight: 500;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            max-width: 1000px;
            padding: 20px;
            margin-bottom: 60px;
        }

        /* The Image Frames */
        .img-card {
            width: 260px;
            height: 360px;
            border: 3px solid var(--wine-red);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(114, 47, 55, 0.4);
            overflow: hidden;
            position: relative;
            cursor: pointer; 
            animation: rotateAndZigZag 14s infinite alternate ease-in-out;
            transition: all 0.4s ease;
        }

        .img-card:nth-child(1) { animation-delay: 0s; }
        .img-card:nth-child(2) { animation-delay: 3s; border-color: var(--pink); }
        .img-card:nth-child(3) { animation-delay: 6s; }

        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Hover effect */
        .img-card:hover {
            animation-play-state: paused;
            z-index: 20;
            box-shadow: 0 15px 50px rgba(255, 192, 203, 0.6);
            border-color: var(--pink);
            transform: translateY(-10px);
        }

        .img-card:hover img {
            transform: scale(1.08);
        }

        /* --- THE POWER NOTE SECTION --- */
        .message-container {
            max-width: 800px;
            text-align: center;
            padding: 40px;
            border-top: 1px solid rgba(255, 192, 203, 0.2);
            border-bottom: 1px solid rgba(255, 192, 203, 0.2);
            background: rgba(10, 10, 10, 0.4);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            z-index: 10;
            margin: 0 20px;
        }

        .message-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--wine-red);
            margin-bottom: 20px;
        }

        .message-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: rgba(255, 192, 203, 0.85);
            font-weight: 300;
        }

        .message-body strong {
            color: var(--gold);
            font-weight: 500;
        }

        .signature {
            margin-top: 30px;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--pink);
            font-style: italic;
        }

        /* Lightbox Overlay */
        #lightbox {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 5, 0.98);
            z-index: 100;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 90vh;
            border: 2px solid var(--wine-red);
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(114, 47, 55, 0.6);
        }

        /* Animation Engine */
        @keyframes rotateAndZigZag {
            0% { transform: translate(0, 0) rotate(0deg); }
            30% { transform: translate(0, 0) rotate(360deg); }
            50% { transform: translate(20px, -15px) rotate(360deg); }
            75% { transform: translate(-20px, 15px) rotate(360deg); }
            100% { transform: translate(0, 0) rotate(365deg); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Happy Birthday, Angel</h1>
        <p class="subtitle">Welcome to Your New Year</p>
    </div>

    <div class="gallery">
        <div class="img-card" onclick="openLightbox('image1.jpeg')"><img src="image1.jpeg" alt="Angel"></div>
        <div class="img-card" onclick="openLightbox('image2.jpeg')"><img src="image2.jpeg" alt="Angel"></div>
        <div class="img-card" onclick="openLightbox('image3.jpeg')"><img src="SF5sI.jpg" alt="Angel"></div>
    </div>

    <div class="message-container">
        <div class="message-title">A Beautiful New Chapter</div>
        <div class="message-body">
            
            Wishing the absolute happiest of birthdays to the girl who makes everything brighter. I can't wait to see what this next year brings you, and I can't wait to make more memories together. 
        </div>
        <div class="signature">Love, Sam</div>
    </div>

    <div id="lightbox" onclick="closeLightbox()">
        <img id="lightbox-img" src="" alt="Enlarged View">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc;
            lightbox.style.display = 'flex';
            setTimeout(() => { lightbox.style.opacity = '1'; }, 10);
        }

        function closeLightbox() {
            lightbox.style.opacity = '0';
            setTimeout(() => { lightbox.style.display = 'none'; }, 500);
        }
    </script>

</body>
</html>
